 <!-- Carrusel de imágenes -->
<div class="carousel-container">
  <button class="carousel-btn left" onclick="scrollCarousel(-1)">&#10094;</button>
  <div class="carousel-track" id="carousel-track">
    <img src="img/Escuela1.png" alt="Imagen 1" />

  </div>
  <button class="carousel-btn right" onclick="scrollCarousel(1)">&#10095;</button>
</div>

  <!-- Script para mantener visible el menú -->
  <script>
    const dropdown = document.getElementById('dropdown');
    let hideTimeout;

    dropdown.addEventListener('mouseenter', () => {
      clearTimeout(hideTimeout);
      dropdown.classList.add('show');
    });

    dropdown.addEventListener('mouseleave', () => {
      hideTimeout = setTimeout(() => {
        dropdown.classList.remove('show');
      }, 300); // Espera antes de cerrar
    });
  </script>

<script>
  function scrollCarousel(direction) {
    const track = document.getElementById("carousel-track");
    const scrollAmount = 300;
    track.scrollBy({
      left: direction * scrollAmount,
      behavior: "smooth",
    });
  }
</script>
