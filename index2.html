<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SION - Bienvenida</title>
  <link rel="stylesheet" href="index2.css" />
</head>
<body class="bienvenida">

  <!-- Barra de navegación -->
  <div class="nav-container">
    <img src="img/imagen7.png" class="img1" alt="Logo Plataforma" />
    <nav class="nav-links">
      <div class="dropdown" id="dropdown">
        <a href="index2.html" id="dropdown-toggle">Acerca de nosotros</a>
        <div class="dropdown-content" id="dropdown-content">
          <a href="index.html">SION Asesorías y Entrenamientos</a>
          <a href="#">Escuela de Productividad</a>
        </div>
      </div>
      <a href="clases.html">Ingrese a la Escuela</a>
    </nav>
  </div>

  <!-- Bienvenida -->
  <header class="welcome-header">
    <h1>Te damos la Bienvenida</h1>
    <p>Seguimos trabajando sobre el 
sistema productivo y económico de Dios</p>
  </header>

  <!-- Galería de imágenes -->
<div class="carousel-container">
  <button class="arrow left" onclick="scrollCarousel(-1)">⬅</button>

  <div class="carousel-track" id="carousel">
    <img src="img/1.jpeg" alt="Imagen 1" />
    <img src="img/2.jpeg" alt="Imagen 2" />
    <img src="img/3.jpeg" alt="Imagen 3" />
    <img src="img/1.jpeg" alt="Imagen 4" />
    <img src="img/2.jpeg" alt="Imagen 5" />
  </div>

  <button class="arrow right" onclick="scrollCarousel(1)">➡</button>
</div>


  <!-- Script para mantener visible el menú -->
  <script>
    const dropdown = document.getElementById('dropdown');
    let hideTimeout;

    dropdown.addEventListener('mouseenter', () => {
      clearTimeout(hideTimeout);
      dropdown.classList.add('show');
    });
    dropdown.addEventListener('mouseleave', () => {
      hideTimeout = setTimeout(() => {
        dropdown.classList.remove('show');
      }, 300); // Espera antes de cerrar
    });
    dropdown.addEventListener('mouseleave', () => {
      hideTimeout = setTimeout(() => {
        dropdown.classList.remove('show');
      }, 300); // Espera antes de cerrar
    });
  </script>

</body>
